version: '3.8'
services:
  ai_service:
    build: 
      context: .
      dockerfile: ai_service/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./ai_service:/app/ai_service
      - ./data:/app/data
    command: uvicorn ai_service.main:app --host 0.0.0.0 --port 8001

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - ai_service
    environment:
      - IA_SERVICE_URL=http://ai_service:8001/predict
      - API_KEY=mi_clave_secreta_123
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000